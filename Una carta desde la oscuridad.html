<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta desde la oscuridad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Pirata+One&display=swap" rel="stylesheet">
<style>
:root{
  --night:#150f1f; --night2:#26172f; --paper:#e6d8bd; --paper2:#d4c19c;
  --ink:#2a1a14; --wine:#8c2342; --candle:#f4b860;
  --title:'Pirata One','Georgia',serif; --body:'IM Fell English','Georgia','Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; height:100%; background:radial-gradient(ellipse at 50% 30%,var(--night2),var(--night) 70%);
  color:var(--paper); font-family:var(--body); overflow:hidden; -webkit-tap-highlight-color:transparent;
}
#dark{position:fixed; inset:0; pointer-events:none; z-index:5;
  background:radial-gradient(circle 260px at var(--x,50%) var(--y,40%),transparent 0,rgba(10,6,16,.35) 55%,rgba(10,6,16,.78) 100%);}
.stage{position:relative; z-index:2; height:100%; display:flex; align-items:center; justify-content:center; padding:16px}
.moon{position:fixed; top:6%; right:8%; width:70px; height:70px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff6dc,#e9d9a8 60%,#c9b57e); box-shadow:0 0 60px 14px rgba(244,184,96,.25); z-index:1}
.bat{position:fixed; font-size:26px; z-index:3; pointer-events:none; opacity:.85; animation:fly linear infinite}
@keyframes fly{from{transform:translateX(-10vw) translateY(0)}50%{transform:translateX(50vw) translateY(-30px)}to{transform:translateX(110vw) translateY(10px)}}

/* Sobre */
#env{position:relative; width:min(340px,86vw); aspect-ratio:3/2; cursor:pointer; text-align:center; transition:opacity .6s, transform .6s}
#env .back{position:absolute; inset:0; background:var(--paper2); border-radius:4px; box-shadow:0 20px 50px rgba(0,0,0,.6)}
#env .front{position:absolute; inset:0; background:var(--paper); border-radius:4px;
  clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%); filter:drop-shadow(0 -2px 2px rgba(0,0,0,.25))}
#env .flap{position:absolute; left:0; right:0; top:0; height:58%; background:#cdb98f; transform-origin:top;
  clip-path:polygon(0 0,100% 0,50% 100%); transition:transform .8s ease; z-index:3}
#env.open .flap{transform:rotateX(180deg)}
#seal{position:absolute; left:50%; top:52%; width:62px; height:62px; margin:-31px 0 0 -31px; z-index:4; border:0; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#c4375f,var(--wine) 60%,#5a1228); color:#f6d9c4; font:28px/1 var(--title);
  box-shadow:0 4px 10px rgba(0,0,0,.5); cursor:pointer; transition:transform .4s, opacity .4s; animation:pulse 2.4s ease-in-out infinite}
#env.open #seal{transform:scale(1.6) rotate(25deg); opacity:0; animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(196,55,95,.18),0 4px 10px rgba(0,0,0,.5)}}
.welcome{position:absolute; left:50%; bottom:calc(100% + 26px); width:min(92vw,520px); transform:translateX(-50%); font:400 clamp(1.5rem,6vw,2.3rem)/1.15 var(--title); color:var(--candle); text-shadow:0 0 18px rgba(244,184,96,.55); transition:opacity .5s}
#env.open .welcome{opacity:0}
.hint{position:absolute; left:0; right:0; bottom:-46px; font-style:italic; color:var(--candle); font-size:1.05rem}
#env.gone{opacity:0; transform:translateY(40px) scale(.9); pointer-events:none}

/* Carta */
#letter{display:none; width:min(560px,100%); max-height:100%; flex-direction:column}
#letter.show{display:flex; animation:rise .9s ease both}
@keyframes rise{from{opacity:0; transform:translateY(40px) scale(.96)}to{opacity:1; transform:none}}
.paper{position:relative; background:linear-gradient(170deg,var(--paper),#dccaa6); color:var(--ink); padding:clamp(22px,5vw,40px);
  border-radius:3px; box-shadow:0 24px 60px rgba(0,0,0,.65), inset 0 0 60px rgba(120,80,30,.25); min-height:320px; overflow:auto}
.paper h1{font:400 clamp(2rem,7vw,2.8rem)/1.05 var(--title); margin:0 0 14px; color:var(--wine)}
.paper p{font-size:clamp(1.08rem,3.6vw,1.25rem); line-height:1.65; margin:0 0 12px; max-width:62ch}
.paper .sign{font:400 1.7rem var(--title); color:var(--wine); margin-top:18px}
.page{display:none}.page.on{display:block; animation:ink .8s ease both}
@keyframes ink{from{opacity:0; filter:blur(6px)}to{opacity:1; filter:none}}
.nav{display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:10px}
.btn{font:inherit; font-size:1.1rem; color:var(--paper); background:var(--night2); border:1px solid var(--candle); border-radius:3px;
  padding:10px 18px; cursor:pointer; transition:background .2s, color .2s}
.btn:hover{background:var(--candle); color:var(--night)}
.btn:focus-visible,#seal:focus-visible,#ghost:focus-visible{outline:3px solid var(--candle); outline-offset:3px}
.btn[disabled]{opacity:.3; pointer-events:none}
.dots{color:var(--candle); letter-spacing:.3em}
.ask{display:flex; gap:14px; flex-wrap:wrap; margin-top:14px; min-height:54px}
.btn.yes{background:var(--wine); border-color:var(--wine); color:#fbe6dc}
.btn.yes:hover{background:#b02e57}
#no{position:relative}

#ghost{position:fixed; z-index:6; left:6%; bottom:12%; font-size:44px; background:none; border:0; cursor:pointer; animation:bob 3.2s ease-in-out infinite; filter:drop-shadow(0 0 12px rgba(255,255,255,.5))}
@keyframes bob{50%{transform:translateY(-16px) rotate(4deg)}}
#toast{position:fixed; z-index:7; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 22px); transform:translate(-50%,30px); opacity:0;
  background:var(--night2); color:var(--paper); border:1px solid var(--candle); padding:12px 18px; border-radius:4px; max-width:88vw; text-align:center;
  transition:all .4s; pointer-events:none; font-size:1.1rem}
#toast.on{opacity:1; transform:translate(-50%,0)}
.burst{position:fixed; z-index:8; font-size:28px; pointer-events:none; animation:pop 1.6s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="moon" aria-hidden="true"></div>
<div id="dark" aria-hidden="true"></div>
<button id="ghost" aria-label="Un fantasma travieso, tócalo">👻</button>

<main class="stage">
  <div id="env" role="button" tabindex="-1">
    <div class="back"></div>
    <div class="front"></div>
    <div class="flap"></div>
    <button id="seal" aria-label="Romper el sello y abrir la carta">♥</button>
    <div class="welcome" id="welcome"></div>
    <div class="hint" id="hint"></div>
  </div>

  <article id="letter" aria-live="polite">
    <div class="paper" id="paper"></div>
    <div class="nav">
      <button class="btn" id="prev">Atrás</button>
      <span class="dots" id="dots" aria-hidden="true"></span>
      <button class="btn" id="next">Seguir leyendo</button>
    </div>
  </article>
</main>
<div id="toast" role="status"></div>

<script>
/* ============ PERSONALIZA AQUÍ ============ */
const CONFIG = {
  welcome: "Señorita Fernanda, bienvenida a mi castillo… ¡muajajaja! 🦇",
  hint: "Rompa el sello si se atreve…",
  title: "Para la señorita Fernanda",
  pages: [
    { h: "Mi estimada Fernanda,", p: [
      "Yo, el Conde Matías, señor de las sombras, guardián de los murciélagos y dueño de este humilde castillo, le doy la más tenebrosa de las bienvenidas. Muajajaja.",
      "Esta carta cruzó bosques embrujados y puentes malditos solo para llegar a sus manos. Si la está leyendo, el hechizo funcionó."
    ]},
    { h: "Un aviso del conde", p: [
      "Debo advertirle que en este castillo hay muchas sorpresas preparadas para usted. Algunas dan un poquito de miedo, otras dan muchísima ternura, y todas fueron hechas pensando en su sonrisa.",
      "Cuidado con los pasillos oscuros: los fantasmas de aquí tienen la mala costumbre de enamorarse de las visitas."
    ]},
    { h: "Lo que descubrí, señorita", p: [
      "Antes creía que lo más aterrador del mundo eran las casas embrujadas. Luego la conocí a usted y entendí que lo realmente aterrador sería no tenerla cerca.",
      "Con usted hasta los lunes tienen un poco de magia."
    ]},
    { h: "Mi lista secreta de cosas que amo", p: [
      "Su risa, que podría despertar a los muertos del cementerio.",
      "Que quiera ver una película de terror y después me pida que la abrace durante todas las escenas.",
      "Que me haga sentir en casa, incluso en una noche de tormenta."
    ]},
    { h: "La pregunta final del conde", p: [
      "He consultado el libro de hechizos, el oráculo y a un gato negro muy sabio. Todos coinciden en lo mismo."
    ], ask: "Señorita Fernanda, ¿se quedaría a mi lado, en este castillo, para todas las noches de brujas que vengan?",
       yes: "¡Sí, mi conde!", no: "No",
       final: "¡Muajajaja! El pacto está sellado con sangre de calabaza. Usted es mía y yo soy suyo, por siempre. 🎃" },
  ],
  sign: "Suyo desde ultratumba, el Conde Matías 🦇",
  secret: "Psst, señorita… el conde dice que revise debajo de su almohada. Hay una sorpresa esperándola 🍬"
};
/* ========================================== */

const $=id=>document.getElementById(id);
let cur=0;

// Luz de vela que sigue el puntero
const dark=$('dark');
const light=(x,y)=>{dark.style.setProperty('--x',x+'px');dark.style.setProperty('--y',y+'px')};
addEventListener('pointermove',e=>light(e.clientX,e.clientY));
light(innerWidth/2,innerHeight*0.4);

// Murciélagos
for(let i=0;i<5;i++){
  const b=document.createElement('div');b.className='bat';b.textContent='🦇';
  b.style.top=(8+Math.random()*40)+'%';b.style.animationDuration=(14+Math.random()*14)+'s';
  b.style.animationDelay=(-Math.random()*20)+'s';b.style.fontSize=(18+Math.random()*18)+'px';
  document.body.appendChild(b);
}

// Pistas y sobre
$('hint').textContent=CONFIG.hint;$('welcome').textContent=CONFIG.welcome;
$('seal').addEventListener('click',()=>{
  $('env').classList.add('open');$('hint').textContent='';
  setTimeout(()=>$('env').classList.add('gone'),1000);
  setTimeout(()=>{$('env').style.display='none';$('letter').classList.add('show')},1500);
});

// Construir páginas
const paper=$('paper');
CONFIG.pages.forEach((pg,i)=>{
  const d=document.createElement('section');d.className='page';
  if(i===0){const t=document.createElement('h1');t.textContent=CONFIG.title;d.appendChild(t)}
  const h=document.createElement('h2');h.textContent=pg.h;
  h.style.cssText='font:400 1.5rem var(--title);color:var(--wine);margin:0 0 10px';d.appendChild(h);
  pg.p.forEach(t=>{const p=document.createElement('p');p.textContent=t;d.appendChild(p)});
  if(pg.ask){
    const q=document.createElement('p');q.textContent=pg.ask;q.style.fontStyle='italic';q.style.fontWeight='bold';d.appendChild(q);
    const a=document.createElement('div');a.className='ask';
    const y=document.createElement('button');y.className='btn yes';y.textContent=pg.yes;
    const n=document.createElement('button');n.className='btn';n.id='no';n.textContent=pg.no;
    a.append(y,n);d.appendChild(a);
    const s=document.createElement('div');s.className='sign';s.id='sign';s.style.display='none';
    s.textContent=CONFIG.sign;d.appendChild(s);
    y.addEventListener('click',()=>accept(pg,y,n,a));
    const flee=()=>{
      n.style.position='fixed';
      const m=12,w=n.offsetWidth,h=n.offsetHeight;
      n.style.left=(m+Math.random()*(innerWidth-w-2*m))+'px';
      n.style.top=(m+Math.random()*(innerHeight-h-2*m))+'px';
      n.style.zIndex=9;
    };
    n.addEventListener('pointerenter',flee);
    n.addEventListener('pointerdown',e=>{e.preventDefault();flee()});
    n.addEventListener('click',e=>{e.preventDefault();flee()});
  }
  paper.appendChild(d);
});

function show(i){
  cur=Math.max(0,Math.min(CONFIG.pages.length-1,i));
  [...paper.children].forEach((c,k)=>c.classList.toggle('on',k===cur));
  $('prev').disabled=cur===0;
  const last=cur===CONFIG.pages.length-1;
  $('next').disabled=last;$('next').style.visibility=last?'hidden':'visible';
  $('dots').textContent=CONFIG.pages.map((_,k)=>k===cur?'●':'○').join(' ');
  paper.scrollTop=0;
}
$('prev').onclick=()=>show(cur-1);
$('next').onclick=()=>show(cur+1);
show(0);

// Respuesta
function accept(pg,y,n,a){
  a.innerHTML='';
  const f=document.createElement('p');f.textContent=pg.final;f.style.cssText='font-size:1.3rem;color:var(--wine);font-weight:bold';
  a.appendChild(f);
  $('sign').style.display='block';
  const em=['🦇','🎃','👻','🕯️','💀','🖤','🕸️'];
  for(let i=0;i<46;i++){
    const e=document.createElement('div');e.className='burst';e.textContent=em[i%em.length];
    e.style.left='50%';e.style.top='55%';
    e.style.setProperty('--dx',(Math.random()*120-60)+'vw');
    e.style.setProperty('--dy',(Math.random()*-90-5)+'vh');
    e.style.setProperty('--r',(Math.random()*720-360)+'deg');
    document.body.appendChild(e);setTimeout(()=>e.remove(),1700);
  }
}

// Fantasma con secreto
$('ghost').onclick=()=>{
  const t=$('toast');t.textContent=CONFIG.secret;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),4500);
};
</script>
</body>
</html>
